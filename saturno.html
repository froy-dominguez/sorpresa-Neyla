<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saturno & Galaxia de Frases 3D</title>
    <!-- Tailwind CSS para la interfaz de usuario -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030308;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .ui-layer {
            position: absolute;
            z-index: 10;
            pointer-events: none;
        }
        .exit-button {
            position: fixed;
            top: 1.25rem;
            right: 1.25rem;
            z-index: 20;
            pointer-events: auto;
            padding: .65rem 1rem;
            border: 1px solid rgba(251, 191, 36, .55);
            border-radius: 999px;
            color: #fde68a;
            background: rgba(3, 3, 8, .72);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
            backdrop-filter: blur(10px);
            font-size: .8rem;
            font-weight: 700;
            text-decoration: none;
            transition: background .2s ease, transform .2s ease;
        }
        .exit-button:hover {
            background: rgba(245, 158, 11, .25);
            transform: translateY(-2px);
        }
    </style>
    <!-- Carga de Three.js y OrbitControls desde CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body class="bg-black text-white">

    <a class="exit-button" href="index.html" aria-label="Regresar a la página principal">⬅ Regresar</a>

    <!-- Contenedor donde se renderizará el lienzo WebGL 3D -->
    <div id="canvas-container"></div>

    <!-- UI flotante de controles interactivos -->
    <div class="ui-layer top-0 left-0 p-6 w-full flex justify-between items-start">
        <div class="pointer-events-auto bg-black/60 backdrop-blur-md border border-amber-500/30 p-4 rounded-2xl shadow-2xl max-w-sm transition-all hover:border-amber-400/50">
            <h1 class="text-xl font-bold text-amber-300 mb-1 flex items-center gap-2">
                🪐 Universo de Saturno & Amor
            </h1>
            <p class="text-xs text-amber-100/70 mb-3">
                Arrastra para rotar en 3D, usa la rueda o pinza para zoom.
            </p>
            <div class="flex flex-wrap gap-2">
                <button id="btn-add-phrase" class="px-3 py-1.5 bg-amber-500/20 hover:bg-amber-500/40 border border-amber-500/50 rounded-xl text-xs font-semibold text-amber-200 transition-all active:scale-95 flex items-center gap-1">
                    ✨ Agregar Frase
                </button>
                <button id="btn-toggle-spin" class="px-3 py-1.5 bg-amber-500/20 hover:bg-amber-500/40 border border-amber-500/50 rounded-xl text-xs font-semibold text-amber-200 transition-all active:scale-95 flex items-center gap-1">
                    🔄 Pausar Órbita
                </button>
            </div>
        </div>
    </div>

    <script>
        // Colección variada de frases románticas
        const PHRASES = [
            "Contigo el día pesa menos",
            "Miras lo bueno, como el girasol",
            "Tu cariño no pasa de moda",
            "Gracias por quedarte siempre",
            "Un girasol para quien ilumina",
            "Como el girasol miro hacia ti",
            "Tu amistad, mi lugar favorito",
            "Aquí siempre tienes un lugar",
            "Hoy el amarillo lleva tu nombre",
            "Que esta flor te alcance hoy",
            "Gracias por sumar luz a mis días",
            "Quiero que sepas cuánto impactas",
            "Feliz día, pienso en ti con cariño",
            "Contigo todo lugar es bonito",
            "El amarillo también dice te quiero",
            "Contigo las tardes se hacen cortas",
            "Eres el centro de mi gravedad",
            "Mi planeta favorito eres tú",
            "Giro a tu alrededor siempre",
            "Luz constante en la oscuridad",
            "Tu sonrisa ilumina mil galaxias",
            "En tu órbita encontré mi hogar",
            "Eres el detalle más bonito del universo",
            "A tu lado cada instante brilla"
        ];

        // Función para generar la textura de las bandas atmosféricas de Saturno
        function createSaturnTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // Degradado base de tonos crema, beige, dorado y ocre
            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0.0, '#3e3124');
            grad.addColorStop(0.15, '#a48b6d');
            grad.addColorStop(0.25, '#d4bc96');
            grad.addColorStop(0.35, '#ebd1a7');
            grad.addColorStop(0.45, '#cbb28b');
            grad.addColorStop(0.5, '#e2c699');
            grad.addColorStop(0.55, '#ba9e78');
            grad.addColorStop(0.65, '#ded0b0');
            grad.addColorStop(0.8, '#8c765c');
            grad.addColorStop(1.0, '#382e22');

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Agregar bandas detalladas con ruido lineal suave
            for (let i = 0; i < 300; i++) {
                const y = Math.random() * canvas.height;
                const h = 1 + Math.random() * 4;
                const alpha = 0.05 + Math.random() * 0.15;
                ctx.fillStyle = (Math.random() > 0.5) ? `rgba(255,245,210,${alpha})` : `rgba(60,40,20,${alpha})`;
                ctx.fillRect(0, y, canvas.width, h);
            }

            return new THREE.CanvasTexture(canvas);
        }

        // Función para generar la textura procedural con transparencia de los Anillos de Saturno
        function createSaturnRingsTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createLinearGradient(0, 0, canvas.width, 0);
            
            // Huecos y divisiones de los anillos (Casini, etc.)
            grad.addColorStop(0.0, 'rgba(0,0,0,0)');
            grad.addColorStop(0.1, 'rgba(140, 115, 80, 0.2)');
            grad.addColorStop(0.25, 'rgba(215, 185, 135, 0.85)');
            grad.addColorStop(0.45, 'rgba(240, 215, 165, 0.95)');
            grad.addColorStop(0.52, 'rgba(30, 20, 10, 0.1)'); // División
            grad.addColorStop(0.60, 'rgba(195, 165, 120, 0.8)');
            grad.addColorStop(0.85, 'rgba(150, 125, 90, 0.5)');
            grad.addColorStop(0.95, 'rgba(100, 80, 55, 0.15)');
            grad.addColorStop(1.0, 'rgba(0,0,0,0)');

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Añadir estrías finas a los anillos
            for (let i = 0; i < 150; i++) {
                const x = Math.random() * canvas.width;
                const w = 1 + Math.random() * 3;
                const opacity = Math.random() * 0.3;
                ctx.fillStyle = `rgba(0,0,0,${opacity})`;
                ctx.fillRect(x, 0, w, canvas.height);
            }

            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        // Función para crear textura de Girasol mediante Canvas 2D
        function createSunflowerTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            const cx = 128;
            const cy = 128;

            // Pétalos dorados
            const petals = 22;
            for (let i = 0; i < petals; i++) {
                const angle = (i * Math.PI * 2) / petals;
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle);
                
                ctx.beginPath();
                ctx.ellipse(0, -65, 14, 55, 0, 0, Math.PI * 2);
                ctx.fillStyle = i % 2 === 0 ? '#ffb700' : '#ffd700';
                ctx.fill();
                ctx.restore();
            }

            // Centro del girasol
            const centerGrad = ctx.createRadialGradient(cx, cy, 5, cx, cy, 35);
            centerGrad.addColorStop(0, '#3d1e03');
            centerGrad.addColorStop(0.7, '#6b3e08');
            centerGrad.addColorStop(1, '#ff9900');

            ctx.beginPath();
            ctx.arc(cx, cy, 35, 0, Math.PI * 2);
            ctx.fillStyle = centerGrad;
            ctx.fill();

            return new THREE.CanvasTexture(canvas);
        }

        // Función para crear una textura de Texto con resplandor dorado
        function createTextTexture(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Resplandor cálido
            ctx.shadowColor = 'rgba(255, 215, 0, 0.9)';
            ctx.shadowBlur = 14;

            ctx.font = 'Bold 23px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            ctx.fillStyle = '#fffbeb';
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);

            return new THREE.CanvasTexture(canvas);
        }

        let scene, camera, renderer, controls;
        let saturnMesh, ringsMesh, orbitGroup;
        let autoRotate = true;

        function init() {
            const container = document.getElementById('canvas-container');

            // Escena
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030308, 0.003);

            // Cámara
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 14, 38);

            // Renderizador
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            container.appendChild(renderer.domElement);

            // Controles de órbita 3D
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxDistance = 120;
            controls.minDistance = 8;

            // Luces del sistema solar
            const ambientLight = new THREE.AmbientLight(0xfff5e6, 0.6);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfffaed, 1.8);
            sunLight.position.set(50, 20, 30);
            scene.add(sunLight);

            // --- PLANETA SATURNO ---
            const saturnGeo = new THREE.SphereGeometry(5, 64, 64);
            const saturnMat = new THREE.MeshStandardMaterial({
                map: createSaturnTexture(),
                roughness: 0.8,
                metalness: 0.1
            });
            saturnMesh = new THREE.Mesh(saturnGeo, saturnMat);
            scene.add(saturnMesh);

            // --- ANILLOS DE SATURNO ---
            const ringsGeo = new THREE.RingGeometry(6.5, 13.5, 128);
            
            // Reorientar coordenadas UV de la geometría del anillo para aplicar el gradiente radial correctamente
            const pos = ringsGeo.attributes.position;
            const uv = ringsGeo.attributes.uv;
            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i);
                const y = pos.getY(i);
                const distance = Math.sqrt(x * x + y * y);
                const normDist = (distance - 6.5) / (13.5 - 6.5);
                uv.setXY(i, normDist, 0.5);
            }

            const ringsMat = new THREE.MeshStandardMaterial({
                map: createSaturnRingsTexture(),
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.9,
                roughness: 0.5
            });
            ringsMesh = new THREE.Mesh(ringsGeo, ringsMat);
            ringsMesh.rotation.x = Math.PI / 2;
            
            // Inclinación axial característica de Saturno (~26.7 grados)
            const saturnTiltGroup = new THREE.Group();
            saturnTiltGroup.add(saturnMesh);
            saturnTiltGroup.add(ringsMesh);
            saturnTiltGroup.rotation.z = THREE.MathUtils.degToRad(26.7);
            saturnTiltGroup.rotation.x = THREE.MathUtils.degToRad(10);
            scene.add(saturnTiltGroup);

            // --- CAMPO DE ESTRELLAS DE FONDO ---
            const starsGeo = new THREE.BufferGeometry();
            const count = 3500;
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            for (let i = 0; i < count * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 250;
                positions[i + 1] = (Math.random() - 0.5) * 250;
                positions[i + 2] = (Math.random() - 0.5) * 250;

                colors[i] = 1.0;
                colors[i + 1] = 0.92 + Math.random() * 0.08;
                colors[i + 2] = 0.7 + Math.random() * 0.3;
            }

            starsGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            starsGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const starsMat = new THREE.PointsMaterial({
                size: 0.8,
                vertexColors: true,
                transparent: true,
                opacity: 0.85
            });

            const starField = new THREE.Points(starsGeo, starsMat);
            scene.add(starField);

            // --- GRUPO ORBITAL DE FRASES Y GIRASOLES ---
            orbitGroup = new THREE.Group();
            scene.add(orbitGroup);

            const sunflowerTexture = createSunflowerTexture();

            const totalElements = 50;
            for (let i = 0; i < totalElements; i++) {
                const phraseText = PHRASES[i % PHRASES.length];
                
                const radius = 14 + Math.random() * 18;
                const angle = Math.random() * Math.PI * 2;
                const height = (Math.random() - 0.5) * 12;

                // Crear Objeto de Frase Flotante
                const textTexture = createTextTexture(phraseText);
                const textMat = new THREE.SpriteMaterial({
                    map: textTexture,
                    transparent: true,
                    blending: THREE.AdditiveBlending
                });
                const textSprite = new THREE.Sprite(textMat);
                textSprite.scale.set(6.5, 1.6, 1);
                textSprite.position.set(
                    Math.cos(angle) * radius,
                    height,
                    Math.sin(angle) * radius
                );
                orbitGroup.add(textSprite);

                // Crear Girasol Flotante 3D
                const sunflowerMat = new THREE.SpriteMaterial({
                    map: sunflowerTexture,
                    transparent: true
                });
                const sunflowerSprite = new THREE.Sprite(sunflowerMat);
                
                const sfScale = 1.2 + Math.random() * 0.9;
                sunflowerSprite.scale.set(sfScale, sfScale, 1);
                
                sunflowerSprite.position.set(
                    Math.cos(angle) * radius + (Math.random() - 0.5) * 2.5,
                    height + (Math.random() - 0.5) * 1.8,
                    Math.sin(angle) * radius + (Math.random() - 0.5) * 2.5
                );
                orbitGroup.add(sunflowerSprite);
            }

            // Eventos
            window.addEventListener('resize', onWindowResize);
            
            document.getElementById('btn-toggle-spin').addEventListener('click', () => {
                autoRotate = !autoRotate;
            });

            document.getElementById('btn-add-phrase').addEventListener('click', addNewPhrase);
        }

        // Agregar frases aleatorias dinámicamente
        function addNewPhrase() {
            const randomPhrase = PHRASES[Math.floor(Math.random() * PHRASES.length)];
            const textTexture = createTextTexture(randomPhrase);
            const textMat = new THREE.SpriteMaterial({
                map: textTexture,
                transparent: true,
                blending: THREE.AdditiveBlending
            });
            const textSprite = new THREE.Sprite(textMat);
            
            const radius = 12 + Math.random() * 16;
            const angle = Math.random() * Math.PI * 2;
            const height = (Math.random() - 0.5) * 10;

            textSprite.scale.set(7, 1.75, 1);
            textSprite.position.set(
                Math.cos(angle) * radius,
                height,
                Math.sin(angle) * radius
            );

            orbitGroup.add(textSprite);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (autoRotate) {
                // Rotación del planeta sobre su propio eje
                saturnMesh.rotation.y += 0.002;
                // Rotación continua del grupo orbital de frases y girasoles
                orbitGroup.rotation.y += 0.0018;
            }

            // Efecto leve de flotación suave en el espacio
            const time = Date.now() * 0.001;
            saturnMesh.position.y = Math.sin(time * 0.4) * 0.15;
            ringsMesh.position.y = saturnMesh.position.y;

            controls.update();
            renderer.render(scene, camera);
        }

        // Ejecución al cargar
        window.onload = function () {
            init();
            animate();
        };
    </script>
</body>
</html>
